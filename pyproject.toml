[project]
name = "laptop-doctor"
version = "2.0.0"
description = "Machine health dashboard, system monitor, cleanup and reports for this laptop"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "psutil>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
